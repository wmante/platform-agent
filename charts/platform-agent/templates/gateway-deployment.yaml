{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}-gateway
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "hermes.labels" . | nindent 8 }}
        {{- if .Values.datadog.enabled }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["hermes", "gateway"]
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_RUN_MODE
              value: gateway
            - name: HERMES_HOME
              value: /hermes-home
            {{- if .Values.datadog.enabled }}
            - name: DD_ENV
              value: {{ .Values.datadog.env }}
            - name: DD_SERVICE
              value: {{ .Values.datadog.service }}-gateway
            - name: DD_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: hermes-home
              mountPath: /hermes-home
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hermes-home
          persistentVolumeClaim:
            claimName: {{ include "hermes.fullname" . }}-home
{{- end }}
