# Deny all ingress by default; allow only nginx-ingress namespace to reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermes.fullname" . }}-allow-nginx-ingress
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
# Allow controlled egress for all workloads:
#   - DNS (UDP/TCP 53) — required for all pods
#   - PostgreSQL (TCP 5432) — database
#   - HTTPS (TCP 443) — LLM APIs and messaging platform webhooks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermes.fullname" . }}-allow-egress
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
